with:

distribution: temurin

java-version: "17"

nane: Set up Android SDK

uses: android-actions/setup-android@v3

name: Set up Gradle

uses: gradle/actions/setup-gradle@v4

with:

gradle-version: 8.9"

name: Extract Nangarhar project

run: |

unzip -q Nangarhar.zip -d extracted

nane: Find Android project

run: 1

PROJECT $(dirname "$(find extracted -name settings.gradle.kts -nase settings.gradle head -n 1)")

echo "PROJECT_DIR=SPROJECT SGITHUB ENV

nane: Build APK

run: 1

cd "$PROJECT DIR"

gradle assembleDebug

- name: Upload APK

uses: actions/upload-artifact@vd

with:

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Maseer-Baryal-Safi-Official-App
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
