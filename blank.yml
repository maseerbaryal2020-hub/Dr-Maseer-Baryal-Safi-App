name: Build Nangarhar APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Nangarhar project
        run: |
          unzip -q Nangarhar.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nangarhar-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
